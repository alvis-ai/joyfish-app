name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with the version used for local development.
          flutter-version: 3.47.7
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Generated route code is committed; fail if it is stale.
      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.gr.dart' '*.g.dart'
      - run: flutter analyze
      - run: flutter test
